<!DOCTYPE html>

<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login Administrador</title>


    <!-- BOOTSTRAP -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <!-- BOOTSTRAP ICONS -->

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >


    <!-- CSS DO PROJETO -->

    <link
        rel="stylesheet"
        href="./css/style.css"
    >

</head>


<body>


<div class="pagina">

<br><br>


    <!-- CONTEÚDO PRINCIPAL -->

    <main class="container conteudo-principal">


        <div class="painel-quantidades painel-controle">


            <!-- TÍTULO -->

            <div class="titulo-painel">

                <span class="icone-caixa">

                    <i class="bi bi-shield-lock"></i>

                </span>


                <h2>

                    ACESSO DO ADMINISTRADOR

                </h2>

            </div>



            <!-- CARD DE LOGIN -->

            <div class="row justify-content-center">


                <div class="col-md-6 col-lg-7">


                    <div class="card-controle text-center">


                        <!-- ÍCONE -->

                        <div class="icone-local">

                            <i class="bi bi-person-lock"></i>

                        </div>


                        <!-- TÍTULO -->

                        <h3 class="nome-local">

                            LOGIN

                        </h3>


                        <p class="descricao-local">

                            Entre com seus dados para continuar

                        </p>


                        <!-- LINHA -->

                        <div class="linha-card"></div>



                        <!-- FORMULÁRIO -->

                        <form
                            action="loginadm.php"
                            method="POST"
                            class="form-controle"
                        >


                            <!-- USUÁRIO -->

                            <div class="text-start mb-3">


                                <label
                                    for="nome"
                                    class="label-quantidade"
                                >

                                    Usuário

                                </label>


                                <div class="input-group input-retirada">


                                    <span class="input-group-text">

                                        <i class="bi bi-person"></i>

                                    </span>


                                    <input
                                        type="text"
                                        id="nome"
                                        name="nome"
                                        required
                                        class="form-control"
                                        placeholder="Digite seu usuário"
                                    >


                                </div>


                            </div>



                            <!-- SENHA -->

                            <div class="text-start mb-4">


                                <label
                                    for="senha"
                                    class="label-quantidade"
                                >

                                    Senha

                                </label>


                                <div class="input-group input-retirada">


                                    <span class="input-group-text">

                                        <i class="bi bi-lock"></i>

                                    </span>


                                    <input
                                        type="password"
                                        name="senha"
                                        id="senha"
                                        required
                                        class="form-control"
                                        placeholder="Digite sua senha"
                                    >


                                    <button
                                        type="button"
                                        class="btn btn-outline-secondary"
                                        onclick="mostrarSenha()"
                                        title="Mostrar senha"
                                    >

                                        <i
                                            id="iconeSenha"
                                            class="bi bi-eye"
                                        ></i>

                                    </button>


                                </div>


                            </div>



                            <!-- BOTÃO ENTRAR -->

                            <button
                                type="submit"
                                class="botao-excluir w-100"
                            >

                                <i class="bi bi-box-arrow-in-right"></i>

                                ENTRAR

                            </button>


                        </form>


                    </div>


                </div>


            </div>


        </div>



        <!-- VOLTAR -->

        <div class="area-administrador">


            <a
                href="index.php"
                class="botao-voltar"
            >

                <i class="bi bi-arrow-left"></i>

                VOLTAR AO PAINEL

            </a>


        </div>


    </main>


</div>



<script>

function mostrarSenha() {

    const senha = document.getElementById("senha");

    const icone = document.getElementById("iconeSenha");


    if (senha.type === "password") {

        senha.type = "text";

        icone.className = "bi bi-eye-slash";

    } else {

        senha.type = "password";

        icone.className = "bi bi-eye";

    }

}

</script>


</body>

</html>
